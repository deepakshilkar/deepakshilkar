params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Personal website and blog"
    author: ["Deepak Shilkar"] # multiple authors
    mainSections: ["research", "philosophy", "opinions"]
    defaultTheme: auto
    # disableThemeToggle: true
    ShowShareButtons: true
    ShowReadingTime: true
    # disableSpecial1stPost: true
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowRssButtonInSectionTermList: true
    ShowToc: true
    comments: true
    disqusShortname: deepakshilkar1
    images: ["papermod-cover.png"]



    profileMode:
        enabled: true
        title: Deepak Shilkar
        subtitle: Researcher, writer, and lifelong learner sharing notes on science, philosophy, and everything in between.
        imageUrl: "/images/logo.png"
        imageTitle: Deepak Shilkar
        # imageWidth: 120
        # imageHeight: 120
        buttons:
            - name: Archives
              url: archives
            - name: Tags
              url: tags

    homeInfoParams:
        Title: "Deepak Shilkar"
        Content: >
            Personal website and blog — notes on research, philosophy, opinions, and miscellaneous tech tips.

    socialIcons:
        - name: github
          url: "https://github.com/deepakshilkar/"
        - name: linkedin
          url: "https://www.linkedin.com/in/deepakshilkar/"
        - name: googlescholar
          url: "https://scholar.google.com/citations?user=vAe-he4AAAAJ"
        - name: cv
          url: "https://www.linkedin.com/in/deepakshilkar/"
        - name: goodreads
          url: "https://www.goodreads.com/deepakshilkar"
        - name: orcid
          url: "https://orcid.org/0000-0003-1882-1731"
        - name: twitter
          url: "https://twitter.com/deepakshilkar"
        - name: mastodon
          url: "https://mastodon.social/@shilsons"
        - name: datacamp
          url: "https://www.datacamp.com/portfolio/deepakshilkar"
    # label:
    #     text: "Home"
    #     icon: icon.png
    #     iconHeight: 35

    analytics:
      google:
        SiteVerificationTag: G-L0T22MKVKM
      bing:
        SiteVerificationTag: AEB5BB2B5D7825F92105F1B9A815B715

    assets:
        disableHLJS: true
    #     favicon: "<link / abs url>"
    #     favicon16x16: "<link / abs url>"
    #     favicon32x32: "<link / abs url>"
    #     apple_touch_icon: "<link / abs url>"
    #     safari_pinned_tab: "<link / abs url>"

    cover:
      hidden: false
      hiddenInList: true
      hiddenInSingle: true
    fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      keys:
        - title
        - permalink
        - summary
        - content


markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        noClasses: false
        # anchorLineNos: true
        # codeFences: true
        # guessSyntax: true
        # lineNos: true
        # style: monokai

privacy:
    vimeo:
        disabled: false
        simple: true

    x:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    googleAnalytics:
        ID: G-L0T22MKVKM
    instagram:
        disableInlineCSS: true
    x:
        disableInlineCSS: true

menu:
  main:
    - identifier: search
      name: Search
      url: /search/
      weight: 10
    - identifier: research
      name: Research
      url: /research/
      weight: 20
    - identifier: philosophy
      name: Philosophy
      url: /philosophy/
      weight: 30
    - identifier: opinions
      name: Opinions
      url: /opinions/
      weight: 40
    - identifier: miscellaneous
      name: Miscellaneous
      url: /miscellaneous/
      weight: 50

outputs:
  home:
    - HTML
    - RSS
    - JSON
